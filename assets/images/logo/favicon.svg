<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Shotloom">
  <title>Shotloom</title>
  <rect width="64" height="64" rx="14" fill="#0b0d12"/>
  <g transform="translate(4,2) scale(0.88)">
  <defs>
    <linearGradient id="slFav" x1="4" y1="8" x2="60" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5b45"/>
      <stop offset="55%" stop-color="#ff7a66"/>
      <stop offset="100%" stop-color="#ff3d8b"/>
    </linearGradient>
  </defs>
  <!-- three camera bodies (shot) -->
  <rect x="3" y="4" width="17" height="14" rx="3" fill="url(#slFav)"/>
  <rect x="6.5" y="7" width="10" height="7" rx="1.5" fill="#0b0d12"/>
  <circle cx="11.5" cy="10.5" r="2.2" fill="url(#slFav)"/>
  <rect x="23.5" y="2" width="17" height="16" rx="3" fill="url(#slFav)"/>
  <rect x="27" y="5.5" width="10" height="8" rx="1.5" fill="#0b0d12"/>
  <circle cx="32" cy="9.5" r="2.4" fill="url(#slFav)"/>
  <rect x="44" y="4" width="17" height="14" rx="3" fill="url(#slFav)"/>
  <rect x="47.5" y="7" width="10" height="7" rx="1.5" fill="#0b0d12"/>
  <circle cx="52.5" cy="10.5" r="2.2" fill="url(#slFav)"/>
  <!-- loom: strands into one timeline cut -->
  <path d="M11.5 18C11.5 29 22 37 32 46" stroke="url(#slFav)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M32 18V46" stroke="url(#slFav)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M52.5 18C52.5 29 42 37 32 46" stroke="url(#slFav)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- timeline clip + play -->
  <rect x="7" y="47" width="50" height="12" rx="3.5" fill="#ff3d8b"/>
  <path fill="#0b0d12" d="M28 50l10 3.5-10 3.5z"/>
  </g>
</svg>
