<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Shotloom">
  <title>Shotloom</title>
  <rect width="64" height="64" rx="14" fill="#0b0d12"/>
  <g transform="translate(4,2) scale(0.88)">
  <defs>
    <linearGradient id="slFav" x1="10" y1="4" x2="54" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5b45"/>
      <stop offset="50%" stop-color="#ff7a66"/>
      <stop offset="100%" stop-color="#ff3d8b"/>
    </linearGradient>
  </defs>
  <!-- left thread -->
  <path d="M16 6v16c0 4 2 7 6 10" stroke="url(#slFav)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- center thread -->
  <path d="M32 4v18c0 3-2 6-6 9c4 3 6 6 6 9" stroke="url(#slFav)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- right thread -->
  <path d="M48 6v16c0 4-2 7-6 10" stroke="url(#slFav)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- braid cross hints -->
  <path d="M22 28c4 3 8 3 12 0" stroke="url(#slFav)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M26 36c3 2 7 2 10 0" stroke="url(#slFav)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- stem into timeline -->
  <path d="M32 44v6" stroke="#ff3d8b" stroke-width="5" stroke-linecap="round"/>
  <!-- timeline bar -->
  <rect x="10" y="50" width="44" height="8" rx="3" fill="#ff3d8b"/>
  <path d="M18 58v3M26 58v3M32 58v3M38 58v3M46 58v3" stroke="#ff3d8b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
